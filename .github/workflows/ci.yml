name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  bash-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check init script
        run: bash -n init

  rust-unix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test busybox-rs and rsh
        run: cargo test -p busybox-rs -p rsh
      - name: Release build (size budget)
        run: cargo build --release -p busybox-rs -p rsh

  rust-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Test all crates
        run: cargo test -p busybox-rs -p rsh -p st-terminal-rs
      - name: Release build
        run: cargo build --release -p busybox-rs -p rsh -p st-terminal-rs
      - name: Upload release artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            target/release/busybox-rs.exe
            target/release/rsh.exe
            target/release/st-terminal-rs.exe
          retention-days: 5
      - name: Enforce 3 MB binary budget
        shell: pwsh
        run: |
          $budget = 3MB
          foreach ($exe in "busybox-rs", "rsh", "st-terminal-rs") {
            $size = (Get-Item "target/release/$exe.exe").Length
            Write-Host ("{0}.exe: {1:N0} bytes" -f $exe, $size)
            if ($size -gt $budget) {
              Write-Error "$exe.exe exceeds the 3 MB budget"
              exit 1
            }
          }
      - name: Terminal smoke test (ConPTY end to end)
        shell: bash
        run: ./target/release/st-terminal-rs.exe --smoke
